name: ✨ Feature request
description: Suggest an idea or improvement for 3DPrintForge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape 3DPrintForge! Describe what you'd like to see.
  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Is your request related to a problem or frustration? Describe it.
      placeholder: "I'm always frustrated when …"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've thought about.
  - type: textarea
    attributes:
      label: Additional context
      description: Mockups, links, examples from other tools, etc.
