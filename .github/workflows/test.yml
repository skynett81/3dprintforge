name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Validate language files
        run: npm run lang:check
      - name: Validate Pterodactyl egg
        run: node -e "JSON.parse(require('fs').readFileSync('egg-3dprintforge.json', 'utf8')); console.log('egg JSON OK')"
      - name: Frontend (/v2) type-check & tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
